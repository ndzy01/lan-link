name: Check library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          # WebKit uses platform-specific networking; test the Apple port for Safari.
          - os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test && pnpm check:package && pnpm build:demo
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser transport and mobile demo checks
        shell: bash
        run: |
          pnpm exec vite --host 127.0.0.1 --port 5290 --strictPort > /tmp/lan-link-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5290/demo/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5290/demo/ > /dev/null
          pnpm test:e2e --project=${{ matrix.browser }}
